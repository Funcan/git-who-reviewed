repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: Check Go formatting with gofmt -s
        entry: bash -c 'unformatted=$(gofmt -s -l .); if [ -n "$unformatted" ]; then echo "These files need gofmt -s -w:"; echo "$unformatted"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        description: Run the Go test suite
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
